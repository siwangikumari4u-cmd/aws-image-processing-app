<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AWS Image Processing App</title>
</head>
<body>

    <h1>AWS Image Processing Application</h1>

    <p>Upload an image to resize and store it in Amazon S3.</p>

    <form method="POST" enctype="multipart/form-data">
        <input type="file" name="image" accept="image/*" required>
        <br><br>
        <button type="submit">Upload Image</button>
    </form>

</body>
</html>
